name: BCQuality Evidence

# Falsifiable evidence that the agents' BCQuality usage is real: every citation in a
# persisted review or audit report must resolve to a file that actually exists in the
# BCQuality clone at the pinned commit. A hallucinated citation fails this check.
#
# Source and version come from claude-plugin/tools/bcquality/bcquality.pin — the same file
# both precondition hooks read. Nothing is hardcoded here.
#
# Manual dispatch: there are no persisted reports in this repository (it is the plugin
# source, not an AL project), so there is nothing to check on a schedule. Run it against a
# consuming project's reports, or after a pin bump to confirm the clone still resolves.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIN_FILE: claude-plugin/tools/bcquality/bcquality.pin

jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone BCQuality at the pinned commit
        run: |
          set -euo pipefail
          pinval() { grep -E "^[[:space:]]*$1[[:space:]]*=" "$PIN_FILE" | head -1 | cut -d= -f2- | tr -d '[:space:]' || true; }
          URL=$(pinval url)
          REF=$(pinval ref)
          PIN=$(pinval pin)
          TARGET="${PIN:-${REF:-main}}"
          echo "Cloning ${URL} @ ${TARGET}"
          git clone --filter=blob:none "$URL" "$RUNNER_TEMP/bcquality"
          git -C "$RUNNER_TEMP/bcquality" checkout --quiet "$TARGET"
          echo "HEAD: $(git -C "$RUNNER_TEMP/bcquality" rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate BCQuality evidence
        run: python3 claude-plugin/tools/bcquality/validate_evidence.py --bcquality-root "$RUNNER_TEMP/bcquality"
